
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #17130a 0%, #050505 55%, #000 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

#orb {
  width: min(75vw, 360px);
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 20px #b88620);
}

#orb::before,
#orb::after {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  border: 2px solid rgba(255,190,60,.65);
  box-shadow: 0 0 25px #b88620, inset 0 0 25px #b88620;
  animation: rotate 12s linear infinite;
}

#orb::after {
  inset: 18%;
  border-color: rgba(255,220,130,.7);
  animation: rotateReverse 8s linear infinite;
}

.core {
  width: 35%;
  height: 35%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff8d0 0%, #ffca55 25%, #9b6414 65%, transparent 100%);
  box-shadow: 0 0 35px #ffbd39, 0 0 75px #d58a1d;
  animation: pulse 2s ease-in-out infinite;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255,200,80,.55);
  animation: rotate 20s linear infinite;
}

#orb.listening {
  filter: drop-shadow(0 0 35px #ffe08a);
}

#orb.listening .core {
  animation-duration: .55s;
}

#orb.speaking .core {
  animation-duration: .3s;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
  to { transform: rotate(-360deg); }
}

@keyframes pulse {
  0%,100% { transform: scale(.85); opacity: .8; }
  50% { transform: scale(1.12); opacity: 1; }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div id="orb" title="Tap to speak">
  <div class="ring"></div>
  <div class="core"></div>
</div>

<script>
/* JARVIS CONFIGURATION */
const CONFIG = {
  AI_ENDPOINT: "https://old-wave-3cc9.shivanshpatelbbu.workers.dev",
  LANGUAGE: "en-GB"
};

const orb = document.getElementById("orb");

let history = [];
let lastWrittenMessage = "";
let listening = false;
let recognition = null;

/* VOICE SYSTEM */
function chooseVoice() {
  const voices = speechSynthesis.getVoices();

  return voices.find(v =>
    v.lang === "en-GB" && /male|daniel|george|arthur/i.test(v.name)
  ) || voices.find(v =>
    v.lang === "en-GB"
  ) || voices.find(v =>
    v.lang.startsWith("en")
  ) || null;
}

function speak(message) {
  if (!message) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = CONFIG.LANGUAGE;
  utterance.rate = 0.92;
  utterance.pitch = 0.85;

  const voice = chooseVoice();
  if (voice) utterance.voice = voice;

  orb.classList.add("speaking");

  utterance.onend = () => {
    orb.classList.remove("speaking");
  };

  utterance.onerror = () => {
    orb.classList.remove("speaking");
  };

  speechSynthesis.speak(utterance);
}

speechSynthesis.onvoiceschanged = chooseVoice;

/* AI BRAIN */
async function askAI(message) {
  const response = await fetch(CONFIG.AI_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: message,
      history: history.slice(-10)
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "AI server returned an error.");
  }

  if (!data.reply) {
    throw new Error("The AI server returned no reply.");
  }

  const answer = data.reply;

  history.push(
    { role: "user", parts: [{ text: message }] },
    { role: "model", parts: [{ text: answer }] }
  );

  return answer;
}

/* COPY COMMAND */
async function processCommand(message) {
  const lower = message.toLowerCase().trim();

  if (
    lower === "copy that message" ||
    lower === "copy the message" ||
    lower === "copy it"
  ) {
    if (!lastWrittenMessage) {
      speak("There is no prepared message to copy.");
      return;
    }

    try {
      await navigator.clipboard.writeText(lastWrittenMessage);
      speak("The message has been copied.");
    } catch (error) {
      speak("I could not access the clipboard. Please use your browser's copy options.");
    }

    return;
  }

  try {
    const answer = await askAI(message);

    if (
      /\b(write|draft|compose|prepare)\b/i.test(message)
    ) {
      lastWrittenMessage = answer;
    }

    speak(answer);

  } catch (error) {
    console.error(error);
    speak("I cannot connect to my AI brain. Please check the server connection.");
  }
}

/* MICROPHONE */
function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    speak("Voice recognition is not supported in this browser. Please use Chrome.");
    return;
  }

  if (listening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = CONFIG.LANGUAGE;
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    orb.classList.add("listening");
  };

  recognition.onresult = event => {
    const message = event.results[0][0].transcript;

    listening = false;
    orb.classList.remove("listening");

    processCommand(message);
  };

  recognition.onerror = event => {
    listening = false;
    orb.classList.remove("listening");

    if (event.error === "not-allowed") {
      speak("Please allow microphone permission.");
    } else if (event.error === "no-speech") {
      speak("I did not hear anything. Please try again.");
    } else {
      speak("There was a microphone error.");
    }
  };

  recognition.onend = () => {
    listening = false;
    orb.classList.remove("listening");
  };

  try {
    recognition.start();
  } catch (error) {
    listening = false;
    orb.classList.remove("listening");
    speak("Please try again.");
  }
}

/* ACTIVATE JARVIS */
orb.addEventListener("click", startListening);

/* INITIALISE */
window.addEventListener("load", () => {
  speechSynthesis.getVoices();
});
</script>

</body>
</html>
